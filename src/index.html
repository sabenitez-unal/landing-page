<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Técnica - Landing Page</title>
    <link href="output.css" rel="stylesheet">
</head>

<body>
    <header class="absolute top-0 left-0 w-full z-50">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <div class="hidden md:flex space-x-6 text-white text-sm font-medium">
                <a href="#" class="hover:text-blue-400">Home</a>
                <a href="#" class="hover:text-blue-400">Product</a>
                <a href="#" class="hover:text-blue-400">Pricing</a>
                <a href="#" class="hover:text-blue-400">About</a>
                <a href="#" class="hover:text-blue-400">Contact</a>
            </div>

            <div class="shrink-0">
                <img src="images/main-image.jpg" alt="Figma Land" class="h-8">
            </div>

            <div class="hidden md:flex space-x-4 text-white">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>

            <div class="md:hidden text-white text-2xl">
                <button id="menu-btn">☰</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="relative h-screen w-full flex items-center justify-center bg-cover bg-center"
            style="background-image: url('images/main-image.jpg');">

            <div class="absolute inset-0 bg-black/50"></div>

            <div class="relative z-10 text-center px-4 max-w-3xl">
                <h1 class="text-white text-4xl md:text-6xl font-bold mb-6">
                    The best products start with Figma
                </h1>
                <p class="text-white text-lg md:text-xl mb-8">
                    Most calendars are designed for teams. Slate is designed for freelancers.
                </p>
                <button class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-full transition">
                    Try For Free
                </button>
            </div>
        </section>
    </main>

</body>

</html>
